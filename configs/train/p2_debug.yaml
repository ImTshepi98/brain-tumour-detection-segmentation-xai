# PLAN2 P3 p2-main: shortcut-controlled model on hemispheres (PLAN2 sections 2-3; checks: tag plan2-prereg)
name: p2-debug
seed: 42
border: 0
midline: 16
width: 16
batch_size: 4           # one draw per group B+, B-, I+, I-
val_batch_size: 4
data_parallel: true
data:
  samples_per_epoch: 8
  limit_train: 0
  limit_val: 0
  workers: 1
augment: {scale: 0.1, shift: 0.1, noise: 0.05, flip: true, flip_axes: [1, 2], erode_max: 2}
model:
  channels: [4, 8, 16, 32, 64]
  attention: true
  cls_hidden: 64
  cls_dropout: 0.0
  adv: false
loss: {w_cls: 0.5, w_adv: 0.0}
optim:
  lr: 3.0e-4
  weight_decay: 1.0e-5
  grad_clip: 1.0
  warmup_epochs: 0
  epochs: 2
debug: {n_brats: 16, n_ixi: 8, shape: [32, 32, 32]}
