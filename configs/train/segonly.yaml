# Phase 5 [SHOULD] segonly: segmentation head only, BraTS cases only
name: segonly
seed: 42
border: required        # mm, from src/calibrate_border.py (BraTS train rows); set with --set border=<b>
batch_size: 4
val_batch_size: 2
data_parallel: true
data:
  sampler: brats_only
  samples_per_epoch: 0  # 0 = number of train subjects
  limit_train: 0        # smoke test only: subjects per cohort
  limit_val: 0
  workers: 4
augment: {scale: 0.1, shift: 0.1, noise: 0.05, flip: true}
model:
  channels: [16, 32, 64, 128, 256]
  attention: true
  cls_hidden: 64
  cls_dropout: 0.0
loss: {w_seg: 1.0, w_cls: 0.0}
optim:
  lr: 3.0e-4
  weight_decay: 1.0e-5
  grad_clip: 1.0
  warmup_epochs: 0
  epochs: 40            # smoke v2: 0.97 steps/s at batch 4 -> ~5.5 min/epoch -> ~3.7 h
