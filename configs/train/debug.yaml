# Local CPU dry run on synthetic 32^3 data (PLAN rule 3)
name: debug
seed: 42
border: 0
batch_size: 2
val_batch_size: 2
data_parallel: true
data:
  sampler: balanced     # each draw: tumour or healthy with p 0.5
  samples_per_epoch: 0  # 0 = number of train subjects
  limit_train: 0        # smoke test only: subjects per cohort
  limit_val: 0
  workers: 1
augment: {scale: 0.1, shift: 0.1, noise: 0.05, flip: true}
model:
  channels: [16, 32, 64, 128, 256]
  attention: true
  cls_hidden: 64
  cls_dropout: 0.0
loss: {w_seg: 1.0, w_cls: 0.5}
optim:
  lr: 3.0e-4
  weight_decay: 1.0e-5
  grad_clip: 1.0
  warmup_epochs: 0
  epochs: 2
debug: {n_brats: 8, n_ixi: 8, shape: [32, 32, 32]}
